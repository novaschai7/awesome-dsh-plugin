url: https://github.com/novaschai7/dsh-plugin-balance-ui
name: novaschai7/dsh-plugin-balance-ui
category: usage
description:
  en: Shows DeepSeek account balance and today's token usage in the sidebar footer, and reconciles the last 7 days of locally estimated spend against the balance the account actually lost.
  zh: 在侧边栏底部显示 DeepSeek 账户余额与今日 token 用量，并把近 7 天本地估算的花费与账户余额实际减少量对账。
